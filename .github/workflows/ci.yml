name: CI

# T-1.8 — Headless test workflow (FR-QA-001).
# Godot version is pinned to 4.3-stable because the project targets Godot 4.3
# (project.godot: config/features=PackedStringArray("4.3")). No "latest".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3-stable

jobs:
  test:
    name: Headless import, parse check, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Godot 4.3-stable (pinned to project target version)
        run: |
          set -euxo pipefail
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      # Step 1: import all resources, then fail if the log contains script or
      # resource load errors. Matched log lines are emitted as annotations.
      - name: Import project resources (headless)
        run: |
          set -euxo pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load" import.log > import_matches.txt; then
            head -5 import_matches.txt | while IFS= read -r line; do
              echo "::error::IMPORT-ERROR-MATCH: ${line:0:250}"
            done
            echo "::error::Import log contained error matches; see annotations"
            exit 1
          fi

      # Step 2: parse check every GDScript file. Any parse failure fails the job.
      - name: Parse check all GDScript files
        if: always()
        run: |
          set -uxo pipefail
          status=0
          for script in $(git ls-files '*.gd'); do
            if godot --headless --path . --check-only --script "res://$script" > "parse_check.log" 2>&1; then
              echo "Parsed OK: res://$script"
            else
              echo "::error::PARSE-FAIL res://$script (log tail in next annotations)"
              tail -5 "parse_check.log" | while IFS= read -r line; do
                echo "::error::PARSE-FAIL res://$script :: ${line:0:230}"
              done
              status=1
            fi
          done
          exit $status

      # Step 3: run the full headless test suite. Runner exits nonzero on any
      # test failure; pipefail propagates the Godot exit code through tee.
      - name: Run headless test suite (TP-1.1 .. TP-1.22)
        if: always()
        run: |
          set -uxo pipefail
          godot --headless --path . --script tests/run_tests.gd 2>&1 | tee test_output.log
          exit ${PIPESTATUS[0]}

      # Step 4: traceability guard — all 22 TP-1.x groups must have executed
      # (PASS or FAIL), no check may report FAIL, and results are written to
      # the public job summary for verifiable evidence.
      - name: Verify all TP-1.x groups executed with zero failures
        if: always()
        run: |
          set -euxo pipefail
          found=$(grep -oE '^(PASS|FAIL): TP-1\.[0-9]+' test_output.log | grep -oE 'TP-1\.[0-9]+' | sort -u | wc -l)
          passed=$(grep -c '^PASS:' test_output.log || true)
          failed=$(grep -c '^FAIL:' test_output.log || true)
          {
            echo "## Test results"
            echo ""
            grep -E 'Phase 1 module tests' test_output.log || true
            echo ""
            echo "- Distinct TP-1.x groups executed: ${found} / 22 (expected 22)"
            echo "- Checks passed: ${passed}"
            echo "- Checks failed: ${failed} (expected 0)"
            echo ""
            echo "Godot version: ${GODOT_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL:' test_output.log | head -10 > failed_checks.txt || true
          while IFS= read -r line; do
            echo "::error::VERIFY-FAILED-CHECK ${line:0:250}"
          done < failed_checks.txt
          for n in $(seq 1 22); do
            if ! grep -qE "^(PASS|FAIL): TP-1\.$n" test_output.log; then
              echo "::error::VERIFY: TP-1.$n did not execute at all"
            fi
          done
          test "$found" -eq 22
          test "$failed" -eq 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            import.log
            test_output.log
          if-no-files-found: ignore
